spring.application.name=springboot-ebook

# MySQL config (adjust by local env variables or direct values)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/ebook_backend?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=${DB_INIT_MODE:never}
spring.sql.init.encoding=UTF-8

# 同一书城 Web 请求使用 Java 21 虚拟线程；慢查询仅用于演示 I/O 等待。
spring.threads.virtual.enabled=true
spring.main.keep-alive=true
app.books.query-delay-ms=${BOOK_QUERY_DELAY_MS:50}
# 演示用默认密钥，实际部署可用环境变量覆盖，不保存服务端 Session。
app.jwt.secret=${APP_JWT_SECRET:ZWJvb2staW50ZWdyYXRlZC1qd3Qta2V5LTIwMjYtMzItYnl0ZXM=}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
springdoc.api-docs.version=OPENAPI_3_0
